parameters:
  - name: azureServiceConnection
    type: string
    default: ""

steps:
  - powershell: |
      ((Get-Content -path "$(BUILD.REPOSITORY.LOCALPATH)\.env.tmp" -Raw) -replace 'IOTHUB_CONNECTION_STRING=".*"','IOTHUB_CONNECTION_STRING="$(IOTHUB_CONNECTION_STRING)"' -replace 'DEVICE_CONNECTION_STRING=".*"','DEVICE_CONNECTION_STRING="$(DEVICE_CONNECTION_STRING)"' -replace 'CONTAINER_REGISTRY_SERVER=".*"','CONTAINER_REGISTRY_SERVER="$(CONTAINER_REGISTRY_SERVER)"' -replace 'CONTAINER_REGISTRY_USERNAME=".*"','CONTAINER_REGISTRY_USERNAME="$(CONTAINER_REGISTRY_USERNAME)"' -replace 'CONTAINER_REGISTRY_PASSWORD=".*"','CONTAINER_REGISTRY_PASSWORD="$(CONTAINER_REGISTRY_PASSWORD)"') | Set-Content -Path "$(BUILD.REPOSITORY.LOCALPATH)\.env.tmp"
    displayName: "Update .env.tmp file"

  - powershell: |
      Copy-Item -Path "$(BUILD.REPOSITORY.LOCALPATH)\.env.tmp" -Destination "$(BUILD.REPOSITORY.LOCALPATH)\.env" -Force
    displayName: "Create .env from .env.tmp"

  - task: UsePythonVersion@0
    inputs:
      versionSpec: "$(python.version)"
      addToPath: true
      architecture: "x64"

  - powershell: |
      sudo npm install -g yo
      sudo npm i -g yo generator-azure-iot-edge-module
    displayName: "Install Yeoman and Azure IoT Edge Node.js module generator packages"

  - powershell: |
      pip install --upgrade pip
      pip install --upgrade tox
      sudo npm i -g iothub-explorer
      az --version
      az extension add --upgrade --name azure-iot
    displayName: "Update and install required tools"

  - script: |
      docker run -d -p 5000:5000 --restart=always --name registry registry:2
    displayName: "Start local container registry"

  - ${{ if eq(parameters.azureServiceConnection, '') }}:
      - script: |
          mvn -v
          sudo -E `which tox` -e "$(TOXENV)"
        displayName: "Run test"
        env:
          IOTHUB_CONNECTION_STRING: $(IOTHUB_CONNECTION_STRING)
          DEVICE_CONNECTION_STRING: $(DEVICE_CONNECTION_STRING)
          CONTAINER_REGISTRY_SERVER: $(CONTAINER_REGISTRY_SERVER)
          CONTAINER_REGISTRY_USERNAME: $(CONTAINER_REGISTRY_USERNAME)
          CONTAINER_REGISTRY_PASSWORD: $(CONTAINER_REGISTRY_PASSWORD)

  - ${{ else }}:
      - task: AzureCLI@2
        displayName: "Run test (AAD)"
        inputs:
          azureSubscription: ${{ parameters.azureServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -e
            az --version
            az extension add --upgrade --name azure-iot --only-show-errors
            az account show -o table
            mvn -v
            registry=`echo "$CONTAINER_REGISTRY_SERVER" | cut -d. -f1`
            token=`az acr login --name "$registry" --expose-token --query accessToken -o tsv --only-show-errors`
            if [ -z "$token" ]; then echo "Could not acquire an ACR token for '$registry'"; exit 1; fi
            export CONTAINER_REGISTRY_USERNAME="00000000-0000-0000-0000-000000000000"
            export CONTAINER_REGISTRY_PASSWORD="$token"
            sudo -E env "AZURE_CONFIG_DIR=$AZURE_CONFIG_DIR" "IOTHUB_AUTH_TYPE=login" \
              "CONTAINER_REGISTRY_USERNAME=$CONTAINER_REGISTRY_USERNAME" \
              "CONTAINER_REGISTRY_PASSWORD=$CONTAINER_REGISTRY_PASSWORD" \
              `which tox` -e "$(TOXENV)"
        env:
          IOTHUB_AUTH_TYPE: login
          IOTHUB_CONNECTION_STRING: $(IOTHUB_CONNECTION_STRING)
          DEVICE_CONNECTION_STRING: $(DEVICE_CONNECTION_STRING)
          CONTAINER_REGISTRY_SERVER: $(CONTAINER_REGISTRY_SERVER)
          CONTAINER_REGISTRY_USERNAME: $(CONTAINER_REGISTRY_USERNAME)
          CONTAINER_REGISTRY_PASSWORD: $(CONTAINER_REGISTRY_PASSWORD)
