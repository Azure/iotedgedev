# Python package
# Create and test a Python package on multiple Python versions.
# Add steps that analyze code, save the dist with the build record, publish to a PyPI-compatible index, and more:
# https://docs.microsoft.com/vsts/pipelines/languages/python
parameters:
  - name: azureServiceConnection
    type: string
    default: 'azurerm-iotedge-test'

pr:
  - main

trigger: none

jobs:
  - job: Windows
    pool:
      vmImage: windows-2022
    strategy:
      matrix:
        Python36:
          python.version: "3.6"
          TOXENV: "py36"
        Python37:
          python.version: "3.7"
          TOXENV: "py37"
        Python38:
          python.version: "3.8"
          TOXENV: "py38"
        Python39:
          python.version: "3.9"
          TOXENV: "py39"
      maxParallel: 1
    steps:
      - powershell: |
          $ErrorActionPreference = 'Continue'
          $svc = Get-Service docker -ErrorAction SilentlyContinue
          if ($null -ne $svc -and $svc.Status -ne 'Running') { Start-Service docker }
          $ok = $false
          $deadline = (Get-Date).AddMinutes(3)
          while (-not $ok -and (Get-Date) -lt $deadline) {
            docker info --format '{{.OSType}}' 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 5 }
          }
          if (-not $ok) { Write-Error 'Docker daemon did not become reachable'; exit 1 }
        displayName: "GUARD: ensure Docker daemon is running"
      - template: win32/continuous-build-win32.yml
        parameters:
          azureServiceConnection: ${{ parameters.azureServiceConnection }}

  # - job: MacOS
  #   pool:
  #     vmImage: macOS-10.13
  #   strategy:
  #     matrix:
  #       Python36:
  #         python.version: "3.6"
  #         TOXENV: "py36"
  #       Python37:
  #         python.version: "3.7"
  #         TOXENV: "py37"
  #      Python38:
  #        python.version: "3.8"
  #        TOXENV: "py38"
  #      Python39:
  #        python.version: "3.9"
  #        TOXENV: "py39"
  #     maxParallel: 1
  #   steps:
  #     - template: darwin/continuous-build-darwin.yml

  - job: Linux2204
    dependsOn: Windows
    condition: succeededOrFailed()
    pool:
      vmImage: ubuntu-22.04
    strategy:
      matrix:
        Python37:
          python.version: "3.7"
          TOXENV: "py37"
        Python38:
          python.version: "3.8"
          TOXENV: "py38"
        Python39:
          python.version: "3.9"
          TOXENV: "py39"
      maxParallel: 1
    steps:
      - template: linux/continuous-build-linux.yml
        parameters:
          azureServiceConnection: ${{ parameters.azureServiceConnection }}
