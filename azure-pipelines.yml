trigger:
  branches:
    include:
    - refs/tags/v*  
 
pool:
  name: Azure-IoT-EdgeExperience-1ES-Hosted-Linux
  demands:
    - ImageOverride -equals MMSUbuntu18.04TLS

steps:
- task: UsePythonVersion@0
  displayName:  "Install Python"
  inputs:
    versionSpec: '3.11'
    addToPath: true
    architecture: 'x64'

- task: Bash@3
  displayName: "Install Python packages"
  inputs:
    targetType: 'inline'
    script: |
      set -euo pipefail
      python -m pip install --upgrade pip
      python -m pip install build twine tox wheel
      sudo apt-get update
      sudo apt-get install -y gcc libpq-dev
      sudo apt-get install -y python3-dev python3-pip python3-venv python3-wheel

- task: Bash@3
  displayName: "Update AIKey"
  inputs:
    targetType: 'inline'
    script: 'sed -i "/__AIkey__/c __AIkey__ = ''$(AIKEY)''" ./iotedgedev/__init__.py'

- task: Bash@3
  inputs:
    targetType: 'inline'
    script: |
      if [[ $(Build.SourceBranch) =~ ^refs/tags/v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
      echo "##vso[task.setvariable variable=WHEEL_PUBLISH_FLAG;]true"
      fi
      VERSION=$(cat ./iotedgedev/__init__.py | grep '__version__' | grep -oP "'\K[^']+")
      echo "##vso[task.setvariable variable=VERSION;]$VERSION"

- task: Bash@3
  displayName: "Build wheel"
  inputs:
    targetType: 'inline'
    script: |
      set -euo pipefail
      python -m build --wheel
      pip install dist/iotedgedev-${VERSION}-py3-none-any.whl && iotedgedev --version

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(Build.SourcesDirectory)'
    archiveFile: '$(Build.ArtifactStagingDirectory)/iotedgedev-$(VERSION)-win32-ia32.zip'

- task: Bash@3
  displayName: "Revert AIKey to Original"
  inputs:
    targetType: 'inline'
    script: 'sed -i "/__AIkey__/c __AIkey__ = ''$(TEST_AIKEY)''" ./iotedgedev/__init__.py'

- task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
  displayName: 'SBOM Generation Task'
  inputs:
    BuildDropPath: '$(Build.SourcesDirectory)/dist'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/dist'
    ArtifactName: 'drop'
    publishLocation: 'Container'

- task: CopyFiles@2
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)/dist/'
    Contents: '*'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'

- task: Bash@3
  displayName: 'Upload to Blob'
  condition: and(succeeded(), eq(variables['WHEEL_PUBLISH_FLAG'], 'true'))
  inputs:
    targetType: 'inline'
    script: |
      export AZCOPY_SPA_CLIENT_SECRET=$(AZURESDKPARTNERDROPS-SERVICE-PRINCIPAL-KEY)
      azcopy login --service-principal --application-id $(APPID)
      azcopy copy "$(Build.ArtifactStagingDirectory)/*"  "https://azuresdkpartnerdrops.blob.core.windows.net/drops/azure-iot-edge-tools-iotedgedev/python/$(VERSION)/"

- task: GitHubRelease@0
  condition: and(succeeded(), eq(variables['WHEEL_PUBLISH_FLAG'], 'true'))
  inputs:
    gitHubConnection: 'github.com_marianan'
    repositoryName: '$(Build.Repository.Name)'
    action: 'create'
    target: '$(Build.SourceVersion)'
    tagSource: 'manual'
    tag: '$(Build.SourceBranch)'
    releaseNotesSource: 'input'
    isPreRelease: true
    addChangeLog: false

- task: Bash@3
  displayName: "Build Docker image"
  inputs:
    targetType: 'inline'
    script: './build-docker.sh iotedgedevtoolscontainerregistry.azurecr.io/public/iotedge/iotedgedev linux'
    workingDirectory: 'docker/tool'

- task: Bash@3
  displayName: "Test local Docker image: toolchain"
  inputs:
    targetType: 'inline'
    script: |
       set -euo pipefail
       PACKAGEVERSION=$(cat ../../iotedgedev/__init__.py | grep '__version__' | grep -oP "'\K[^']+")
       echo "##vso[task.setvariable variable=VERSION]$PACKAGEVERSION"
       IMAGE="iotedgedevtoolscontainerregistry.azurecr.io/public/iotedge/iotedgedev:${PACKAGEVERSION}"

       docker run --rm "$IMAGE" bash -c '
         set -eux
         python3 -c "import sys; assert (3, 11) <= sys.version_info < (3, 15), sys.version"
         iotedgedev --version
         dotnet --version
         node --version
         npm --version
         mvn --version
         java -version
         docker --version
       '
    workingDirectory: 'docker/tool'

# Scaffolding fetches templates from Maven Central, NuGet and npm, so this step
# depends on registry availability at release time and is retried before failing.
- task: Bash@3
  displayName: "Test local Docker image: module scaffolding"
  inputs:
    targetType: 'inline'
    script: |
       set -euo pipefail
       PACKAGEVERSION=$(cat ../../iotedgedev/__init__.py | grep '__version__' | grep -oP "'\K[^']+")
       IMAGE="iotedgedevtoolscontainerregistry.azurecr.io/public/iotedge/iotedgedev:${PACKAGEVERSION}"

       for t in csharp nodejs python java; do
         attempt=0
         until [ "$attempt" -ge 3 ]; do
           if docker run --rm "$IMAGE" bash -c "
                set -eux
                d=\$(mktemp -d)
                cd \"\$d\"
                iotedgedev solution new sol_$t -t $t
                test -f sol_$t/deployment.template.json
              "; then
             echo "scaffold $t: ok"
             break
           fi
           attempt=$((attempt + 1))
           echo "scaffold $t: attempt $attempt failed"
           if [ "$attempt" -lt 3 ]; then
             sleep $((attempt * 15))
           fi
         done
         if [ "$attempt" -ge 3 ]; then
           echo "##vso[task.logissue type=error]scaffold $t failed after 3 attempts"
           exit 1
         fi
       done
    workingDirectory: 'docker/tool'

- task: Docker@2
  condition: and(succeeded(), eq(variables['WHEEL_PUBLISH_FLAG'], 'true'))
  displayName: "Push docker image to acr"
  inputs:
    containerRegistry: 'IoTEdgeDev-Docker'
    repository: 'public/iotedge/iotedgedev'
    command: 'push'
    tags: |
      $(VERSION)
      latest

- task: Bash@3
  condition: and(succeeded(), eq(variables['WHEEL_PUBLISH_FLAG'], 'true'))
  displayName: "Test last uploaded Docker image"
  inputs:
    targetType: 'inline'
    script: |
      set -euo pipefail
      PACKAGEVERSION=$(cat ../../iotedgedev/__init__.py | grep '__version__' | grep -oP "'\K[^']+")
      IMAGE="iotedgedevtoolscontainerregistry.azurecr.io/public/iotedge/iotedgedev:${PACKAGEVERSION}"

      docker pull "$IMAGE"

      docker run --rm "$IMAGE" bash -c '
        set -eux
        python3 -c "import sys; assert (3, 11) <= sys.version_info < (3, 15), sys.version"
        iotedgedev --version
      '
    workingDirectory: 'docker/tool'
